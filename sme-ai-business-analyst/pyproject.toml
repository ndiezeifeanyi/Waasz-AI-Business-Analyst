[project]
name = "Waasz-AI"
version = "0.1.0"
description = "WhatsApp-first AI business analyst MVP for informal Nigerian SMEs."
requires-python = ">=3.12,<3.14"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
